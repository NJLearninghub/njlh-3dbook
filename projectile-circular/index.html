  cV.set(p,C.cutVel.clone().multiplyScalar(.35));cLV.position.copy(p).add(new THREE.Vector3(0,.35,0));ghost.visible=true;ghost.setPts([C.cutPos,C.cutPos.clone().addScaledVector(C.cutVel,3)]);if(C.cutT>2.6){C.cut=false;cLA.visible=true}}
 glowLight.position.copy(stone.position)}
// ---------- chapters ----------
const chapters=[
 {key:'proj',title:'Projectile motion',text:['A ball launched at speed u and angle θ','moves sideways at constant speed while','gravity pulls it down — the path','is a parabola.'],fig:'Fig. 4.2  A cannon on the page, firing a ball.',tap:'Press ▶ to fire. Drag to look around.'},
 {key:'circ',title:'Circular motion',text:['A stone whirled on a string keeps','changing direction. The string pulls it','towards the centre: centripetal','acceleration v²/r.'],fig:'Fig. 4.7  A stone on a string, seen from above.',tap:'Cut the string and watch the tangent.'},
 {key:'quiz',title:'Quick check',text:['Five quick questions to test','what you have seen on these','two pages.'],fig:'Fig. 4.9  Try the quiz below.',tap:'Tap an answer to check it.'}];
let ci=0;
function setPages(){const ch=chapters[ci];for(const s of['L','R']){pageMats[s].map?.dispose();pageMats[s].map=pageTex(s,ch);pageMats[s].needsUpdate=true}}
const sl=(id,lab,min,max,step,val,unit)=>`<div class="row"><span>${lab}</span><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o">${val} ${unit}</output></div>`;
const Q=[["At the top of its flight, a projectile's velocity is…",["zero","horizontal","vertical","maximum"],1],["Range is maximum (h = 0) when θ equals…",["30°","45°","60°","90°"],1],["Which angle gives the same range as 30°?",["45°","50°","60°","75°"],2],["In uniform circular motion, acceleration points…",["along v","outward","towards centre","nowhere – it is zero"],2],["If the string is cut, the stone moves…",["radially out","along the tangent","towards centre","in a spiral"],1]];
function renderCard(){const ch=chapters[ci];$('#cardTitle').textContent=`${ci+1}. ${ch.title}`;$('#chapName').innerHTML=`<span>${ci+1}</span>${ch.title}`;let h='';
 if(ch.key==='proj'){h=`<p>Horizontal and vertical motions are independent. Horizontally there is no force, so $v_x=u\\cos\\theta$ stays constant; vertically gravity gives $v_y=u\\sin\\theta-gt$.</p>
 <div class="f">$$T=\\frac{2u\\sin\\theta}{g},\\quad H=\\frac{u^2\\sin^2\\theta}{2g},\\quad R=\\frac{u^2\\sin2\\theta}{g}$$</div><p style="font-size:13px;opacity:.8">(formulas for h = 0; the simulation also handles launch from height h)</p>
 ${sl('u','u',5,40,1,P.u,'m/s')}${sl('th','θ',5,85,1,P.th,'°')}${sl('g','g',1.6,25,.1,P.g,'m/s²')}${sl('h','h',0,30,1,P.h,'m')}
 <div class="reads"><div>T<b id="rT"></b></div><div>H<b id="rH"></b></div><div>R<b id="rR"></b></div></div>
 <div class="btns"><button class="pill" id="fire">▶ Fire</button><button class="pill ${P.cmp?'on':''}" id="cmp">θ vs 90°−θ</button><button class="pill ${P.slow?'on':''}" id="slow">Slow-mo</button></div><div id="cmpTxt" style="font-size:13px;margin-top:6px"></div>`}
 else if(ch.key==='circ'){h=`<p>Speed stays the same but direction keeps changing, so the stone accelerates towards the centre. The string supplies this centripetal force.</p>
 <div class="f">$$\\omega=\\frac{v}{r},\\quad a_c=\\frac{v^2}{r}=\\omega^2 r,\\quad T=\\frac{2\\pi r}{v},\\quad f=\\frac1T$$</div>
 ${sl('r','r',.5,2.5,.1,C.r,'m')}${sl('v','v',.5,6,.1,C.v,'m/s')}
 <div class="reads"><div>ω<b id="rW"></b></div><div>a<sub>c</sub><b id="rA"></b></div><div>T<b id="rP"></b></div><div>f<b id="rF"></b></div></div>
 <div class="btns"><button class="pill" id="cut">✂ Cut the string</button></div>`}
 else{h=Q.map((q,i)=>`<div class="q"><b>${i+1}.</b> ${q[0]}<div class="opts">${q[1].map((o,j)=>`<button class="pill" data-q="${i}" data-o="${j}">${o}</button>`).join('')}</div></div>`).join('')+`<div id="score" style="font-weight:600"></div>`}
 $('#cardBody').innerHTML=h;wire();kx();upd()}
let score={};
function wire(){const on=(id,f)=>{const e=$('#'+id);if(e)e.oninput=e.onclick=f};
 for(const k of['u','th','g','h'])on(k,e=>{P[k]=+e.target.value;P.t=0;P.run=false;upd()});
 on('r',e=>{C.r=+e.target.value;upd()});on('v',e=>{C.v=+e.target.value;upd()});
 const f=$('#fire');if(f)f.onclick=()=>fire();
 const c=$('#cmp');if(c)c.onclick=()=>{P.cmp=!P.cmp;c.classList.toggle('on',P.cmp);P.t=0;upd()};
 const s=$('#slow');if(s)s.onclick=()=>{P.slow=!P.slow;s.classList.toggle('on',P.slow)};
 const k=$('#cut');if(k)k.onclick=()=>{if(!C.cut){C.cut=true;C.cutT=0;beep(300,.15)}};
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const qi=+b.dataset.q,oi=+b.dataset.o;if(qi in score)return;const ok=oi===Q[qi][2];score[qi]=ok;b.classList.add(ok?'ok':'no');
  if(!ok)b.parentNode.children[Q[qi][2]].classList.add('ok');beep(ok?880:200,.12);const n=Object.keys(score).length;if(n===5)$('#score').textContent=`Score: ${Object.values(score).filter(x=>x).length} / 5`})}
function kx(){if(window.renderMathInElement)renderMathInElement($('#cardBody'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})}
window.__kx=kx;
function upd(){const fx=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v};
 for(const[k,u]of[['u','m/s'],['th','°'],['g','m/s²'],['h','m']])fx(k+'o',P[k]+' '+u);fx('ro',C.r+' m');fx('vo',C.v+' m/s');
 const a=pTRH(P.u,P.th,P.g,P.h);fx('rT',a.T.toFixed(2)+' s');fx('rH',a.H.toFixed(1)+' m');fx('rR',a.R.toFixed(1)+' m');
 if(P.cmp){const b=pTRH(P.u,90-P.th,P.g,P.h);fx('cmpTxt',`θ = ${P.th}° → R = ${a.R.toFixed(1)} m · 90°−θ = ${90-P.th}° → R = ${b.R.toFixed(1)} m ${P.h===0?'(equal when h = 0!)':''}`)}else fx('cmpTxt','');
 const w=C.v/C.r;fx('rW',w.toFixed(2)+' rad/s');fx('rA',(C.v*C.v/C.r).toFixed(1)+' m/s²');fx('rP',(2*Math.PI/w).toFixed(2)+' s');fx('rF',(w/2/Math.PI).toFixed(2)+' Hz');
 layoutProj();placeProj()}
function fire(){P.t=0;P.run=true;trailPts=[];beep(140,.25,'sawtooth');setPlay(true)}
function go(i){ci=(i+chapters.length)%chapters.length;setPages();renderCard();const k=chapters[ci].key;proj.visible=k!=='circ';circ.visible=k!=='proj';
 if(k==='quiz'){proj.visible=circ.visible=true}frame()}
// camera framing
function frame(){const port=innerHeight>innerWidth;const k=chapters[ci].key;
 const tgt=k==='circ'?new THREE.Vector3(port?2.4:1.2,1.2,-.2):new THREE.Vector3(port?-.6:0,1.4,0);controls.target.copy(tgt);
 camera.fov=port?52:36;const d=port?21:17;camera.position.set(tgt.x+(port?.8:1.5),tgt.y+d*.62,tgt.z+d*.78);if(port)controls.target.y-=.6;camera.updateProjectionMatrix()}
// sound
let snd=false,actx;function beep(f,d,type='sine'){if(!snd)return;actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
let playing=true;function setPlay(p){playing=p;$('#playIco').setAttribute('d',p?'M7 5h3v14H7zM14 5h3v14h-3z':'M8 5l11 7-11 7z')}
$('#bPlay').onclick=()=>{if(chapters[ci].key==='proj'&&(!P.run||P.t>=pTRH(P.u,P.th,P.g,P.h).T)){fire();return}setPlay(!playing)};
$('#bPrev').onclick=()=>go(ci-1);$('#bNext').onclick=()=>go(ci+1);$('#bQuiz').onclick=()=>{go(2);$('#card').classList.add('open')};
$('#bSnd').onclick=()=>{snd=!snd;$('#sndX').style.display=snd?'none':'';beep(660,.1)};
$('#bTheme').onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');scene.background.set(d?0x1c1a24:0xd8cfbd);scene.fog.color.copy(scene.background);sun.intensity=d?.6:2.4;hemi.intensity=d?.35:.9;glowLight.intensity=d?3:1.2};
$('#cardHead').onclick=()=>$('#card').classList.toggle('open');
$('#menu').innerHTML=chapters.map((c,i)=>`<div data-i="${i}">${i+1}. ${c.title}</div>`).join('');
$('#bMenu').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('show')};
$('#menu').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){go(+i);$('#menu').classList.remove('show')}};
// loop
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',()=>{resize();frame()});resize();
glowLight.intensity=1.2;go(0);setPlay(false);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);controls.update();sunDood.rotation.z+=dt*.2;
 const k=chapters[ci].key;
 if(proj.visible){if(P.run&&playing){P.t+=dt*(P.slow?.25:1)*Math.min(1,6/Math.max(pTRH(P.u,P.th,P.g,P.h).T,1));const T=pTRH(P.u,P.th,P.g,P.h).T;if(P.t>=T){P.t=T;P.run=false;setPlay(false);beep(90,.2)}}
  placeProj();if(P.run){trailPts.push(ball.position.clone());trail.setPts(trailPts)}else if(P.t===0){trailPts=[];trail.setPts([])}}
 if(circ.visible)placeCirc(k==='circ'&&!playing&&!C.cut?0:dt);
 renderer.render(scene,camera)});
// circular plays by default when on that chapter
const _go=go;
</script></body></html>
