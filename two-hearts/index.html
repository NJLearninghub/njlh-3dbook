 // floor plate glow

}
const P=car(0xff8a3a,-2.1,false),E=car(0x6fbcff,2.1,true);
// sparks for regen / heat
const NP=160,pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3),pv=[];for(let i=0;i<NP;i++)pv.push({x:0,y:-9,z:0,vx:0,vy:0,vz:0,l:0,c:[0,0,0]});
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));const pc=new Float32Array(NP*3);pg.setAttribute('color',new THREE.BufferAttribute(pc,3));

// ---------- physics ----------

const hold=(el,set)=>{const on=e=>{e.preventDefault();set(true);el.classList.add('on');initAudio()},off=()=>{set(false);el.classList.remove('on')};

hold($('#drive'),b=>drive=b);hold($('#brake'),b=>brk=b);
addEventListener('keydown',e=>{if(e.code==='ArrowUp'||e.code==='Space')drive=true;if(e.code==='ArrowDown')brk=true});

let AC,osc,gain,sound=false;
function initAudio(){if(AC||!sound)return;AC=new AudioContext();osc=AC.createOscillator();osc.type='sawtooth';gain=AC.createGain();gain.gain.value=0;const f=AC.createBiquadFilter();f.frequency.value=600;osc.connect(f).connect(gain).connect(AC.destination);osc.start()}

const fmt=x=>x<1000?x.toFixed(1)+' kJ':(x/1000).toFixed(2)+' MJ';
// ---------- loop ----------
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h);comp.setSize(w,h);bloom.resolution.set(w,h);cam.aspect=w/h;
 PORT=h>w;cam.updateProjectionMatrix()}

// ---------- cinematic camera rig ----------
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
// shot = [camera pos, look target, fov]
const SH={
 wide:[V3(9,6,12),V3(0,.6,0),40], hero:[V3(-7,3.2,9),V3(0,.8,0),38],
 eng:[V3(-5.2,2.6,4.4),V3(-2.1,1,1.3),30], engTop:[V3(-2.6,4.4,3.6),V3(-2.1,1,1.2),32],
 bat:[V3(5.4,1.6,1.8),V3(2.1,.45,-.4),32], mot:[V3(4.2,1.1,-4.2),V3(2.1,.45,-1.4),30],
 low:[V3(6.5,.55,3.5),V3(0,.7,-3),36], lowL:[V3(-6.5,.55,3.5),V3(0,.7,-3),36],
 rear:[V3(0,2.2,10),V3(0,.9,-4),40], front:[V3(1,1.6,-9),V3(0,.8,0),40],
 top:[V3(0,13,4),V3(0,0,-.5),40], regen:[V3(5,1.3,3),V3(2.1,.5,0),30], pbrake:[V3(-4.6,.8,3.4),V3(-2.1,.42,1.4),30]};

const cur={pos:V3(9,6,12),look:V3(0,.6,0),fov:40},from={pos:V3(),look:V3(),fov:40};let tr=1,shotName='wide',stg=-1;

// user orbit offset (drag), eases back after release

const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let drv=0,brkS=0,shk=0;const tmp=V3(),tmpL=V3();
function camUpdate(dt,t,v){

 const S_=SH[shotName];tr=Math.min(1,tr+dt/1.6);const k=ease(tr);

// speed lines
const NS=70,sg=new THREE.BufferGeometry(),sp_=new Float32Array(NS*6),sd=[];
for(let i=0;i<NS;i++)sd.push({x:(Math.random()<.5?-1:1)*(5+Math.random()*8),y:.3+Math.random()*4,z:-40+Math.random()*60});
